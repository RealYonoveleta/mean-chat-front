@for (message of messages(); track message._id) {
  @if (shouldInsertTimeLabel($index)) {
    <span class="time-label">{{ message.createdAt | date: 'short' }}</span>
  }
  <app-message-item
    [message]="message"
    [isGrouped]="isGrouped($index)"
    [isFirstOfGroup]="isFirstOfGroup($index)"
    [isSelf]="message.sender._id === currentUserId"
  ></app-message-item>
}
