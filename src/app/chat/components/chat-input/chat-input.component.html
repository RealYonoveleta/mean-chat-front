<form class="container" [formGroup]="sendMessageForm" (ngSubmit)="sendMessage()">
  <div class="input-actions">
    <ion-button (click)="toggleExpressionPicker()" fill="clear" shape="round">
      <ion-icon name="happy" slot="icon-only"></ion-icon>
    </ion-button>
    <ion-input
      #input
      id="text-input"
      placeholder="Message"
      fill="solid"
      formControlName="message"
    ></ion-input>
    <ion-button (click)="sendLocation()" fill="clear" shape="round">
      <ion-icon name="location" slot="icon-only"></ion-icon>
    </ion-button>
  </div>
  <ion-button type="submit">
    <ion-icon name="send"></ion-icon>
  </ion-button>
</form>

<div
  class="expression-picker"
  [style.height]="expressionPickerOpened() ? pickerHeight() + 'px' : '0'"
>
  <div class="drag-handle" (pointerdown)="onPickerDragStart($event)">
    <div class="drag-pill"></div>
  </div>
  <app-expression-picker style="flex: 1; overflow: hidden"></app-expression-picker>
</div>
